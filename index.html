<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bavis MeeCan</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; }
      #screen { image-rendering: pixelated; background: #000080; display: block; width: 100%; height: 100%; }
      #ui {
        position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
        color: #ffffff; font: 14px monospace; pointer-events: none;
      }
      #ui > * { pointer-events: auto; }
      #summon { align-self: flex-end; text-align: right; max-width: 60%; padding: 0.5em; }
      #summon p { margin: 0.25em 0; }
      #start {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #ffffff; font: 16px monospace; cursor: pointer; user-select: none; background: rgba(0, 0, 0, 0.6);
      }
      #start[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" width="640" height="480"></canvas>
      <div id="ui"><div id="summon"></div><div id="typing"></div></div>
    </div>
    <div id="start">Tap or press any key to begin</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
